name: Deploy (nifty)

on:
  push:
    branches: ["nifty"]

concurrency:
  group: deploy-nifty
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.NIFTY_EC2_HOST }}
          username: ${{ secrets.NIFTY_EC2_USER }}
          key: ${{ secrets.NIFTY_EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/apps/ai_agent_1
            git fetch origin
            git checkout nifty
            git pull --ff-only

            cd /home/ubuntu/apps/ai_agent_1/nifty
            . .venv/bin/activate
            pip install -r requirements.txt

            sudo systemctl restart nifty
            sudo systemctl status nifty --no-pager
