name: Deploy dev to ECS

# Build the image and roll the ECS service whenever app code changes on the
# dev branch. Terraform-only changes do not trigger a deploy.
on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - 'app/**'
      - 'frontend/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/deploy.yml'

# OIDC needs id-token: write. contents: read is for actions/checkout.
permissions:
  id-token: write
  contents: read

# Don't let two deploys race the same service.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: 361739112666.dkr.ecr.ap-south-1.amazonaws.com/market-stream-dev/api
  ECS_CLUSTER: market-stream-dev-cluster
  ECS_SERVICE: market-stream-dev
  # From `terraform output github_actions_role_arn`.
  AWS_ROLE_ARN: arn:aws:iam::361739112666:role/market-stream-dev-github-actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image (linux/amd64)
        run: |
          IMAGE_TAG="${GITHUB_SHA::12}"
          docker build --platform linux/amd64 \
            -t "$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REPOSITORY:latest" \
            .
          docker push "$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REPOSITORY:latest"

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --region "$AWS_REGION" \
            --no-cli-pager

      - name: Wait for service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION"
