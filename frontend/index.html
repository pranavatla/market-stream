<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>market-stream</title>
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root {
    --bg-primary: #0a0e17;
    --bg-card: #111827;
    --bg-input: #1a2234;
    --border: #1e2a3a;
    --text-primary: #e2e8f0;
    --text-muted: #64748b;
    --accent-green: #22c55e;
    --accent-red: #ef4444;
    --accent-blue: #3b82f6;
    --accent-amber: #f59e0b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-card);
  }
  .header h1 {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 1px;
  }
  .header h1 span { color: var(--accent-blue); }
  .connection-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--text-muted);
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent-red);
  }
  .status-dot.connected { background: var(--accent-green); }

  /* Layout */
  .container {
    display: grid;
    grid-template-columns: 1fr 320px;
    grid-template-rows: auto 1fr;
    gap: 1px;
    background: var(--border);
    height: calc(100vh - 49px);
  }

  /* Symbol tabs */
  .symbol-bar {
    grid-column: 1 / -1;
    display: flex;
    gap: 0;
    background: var(--bg-card);
    overflow-x: auto;
  }
  .symbol-tab {
    padding: 10px 20px;
    cursor: pointer;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-family: inherit;
    font-size: 12px;
    border-bottom: 2px solid transparent;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .symbol-tab:hover { color: var(--text-primary); }
  .symbol-tab.active {
    color: var(--text-primary);
    border-bottom-color: var(--accent-blue);
  }
  .symbol-tab .tab-price {
    margin-left: 8px;
    font-size: 11px;
  }
  .symbol-tab .tab-price.up { color: var(--accent-green); }
  .symbol-tab .tab-price.down { color: var(--accent-red); }

  /* Chart area */
  .chart-panel {
    background: var(--bg-primary);
    position: relative;
    overflow: hidden;
  }
  #chart { width: 100%; height: 100%; }

  /* Right panel */
  .right-panel {
    background: var(--bg-card);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel-section {
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }
  .panel-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    margin-bottom: 12px;
  }

  /* Stats grid */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .stat-item {
    background: var(--bg-input);
    padding: 8px 10px;
    border-radius: 4px;
  }
  .stat-label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
  }
  .stat-value {
    font-size: 14px;
    font-weight: 600;
    margin-top: 2px;
  }
  .stat-value.up { color: var(--accent-green); }
  .stat-value.down { color: var(--accent-red); }

  /* Alert form */
  .alert-form {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .alert-form .form-row {
    display: flex;
    gap: 6px;
  }
  .alert-form input, .alert-form select {
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text-primary);
    font-family: inherit;
    font-size: 12px;
    padding: 6px 8px;
    border-radius: 4px;
    flex: 1;
  }
  .alert-form input:focus, .alert-form select:focus {
    outline: none;
    border-color: var(--accent-blue);
  }
  .alert-form button {
    background: var(--accent-blue);
    color: white;
    border: none;
    font-family: inherit;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 600;
  }
  .alert-form button:hover { opacity: 0.85; }

  /* Alert list */
  .alert-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
  }
  .alert-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 10px;
    background: var(--bg-input);
    border-radius: 4px;
    margin-bottom: 6px;
    font-size: 12px;
  }
  .alert-item .alert-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .alert-item .alert-dir {
    font-size: 10px;
    color: var(--text-muted);
  }
  .alert-item .alert-remove {
    background: none;
    border: none;
    color: var(--accent-red);
    cursor: pointer;
    font-size: 14px;
    padding: 2px 6px;
  }

  /* Event feed */
  .event-feed {
    flex: 1;
    overflow-y: auto;
    padding: 0 16px 16px;
  }
  .event-item {
    padding: 8px 10px;
    background: var(--bg-input);
    border-left: 3px solid var(--accent-amber);
    border-radius: 0 4px 4px 0;
    margin-bottom: 6px;
    font-size: 11px;
    line-height: 1.5;
  }
  .event-item .event-time {
    color: var(--text-muted);
    font-size: 10px;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .container {
      grid-template-columns: 1fr;
      grid-template-rows: auto 50vh auto;
    }
  }
</style>
</head>
<body>

<div class="header">
  <h1>MARKET<span>·</span>STREAM</h1>
  <div class="connection-status">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Connecting...</span>
  </div>
</div>

<div class="container">
  <!-- Symbol tabs -->
  <div class="symbol-bar" id="symbolBar"></div>

  <!-- Chart -->
  <div class="chart-panel">
    <div id="chart"></div>
  </div>

  <!-- Right panel -->
  <div class="right-panel">
    <!-- Live stats -->
    <div class="panel-section">
      <div class="panel-title">Live Stats</div>
      <div class="stats-grid" id="statsGrid">
        <div class="stat-item"><div class="stat-label">Last</div><div class="stat-value" id="statLast">--</div></div>
        <div class="stat-item"><div class="stat-label">Change</div><div class="stat-value" id="statChange">--</div></div>
        <div class="stat-item"><div class="stat-label">High</div><div class="stat-value" id="statHigh">--</div></div>
        <div class="stat-item"><div class="stat-label">Low</div><div class="stat-value" id="statLow">--</div></div>
        <div class="stat-item"><div class="stat-label">Volume</div><div class="stat-value" id="statVol">--</div></div>
        <div class="stat-item"><div class="stat-label">Ticks/s</div><div class="stat-value" id="statTps">--</div></div>
      </div>
    </div>

    <!-- Alerts -->
    <div class="panel-section">
      <div class="panel-title">Price Alerts</div>
      <div class="alert-form">
        <div class="form-row">
          <input type="number" id="alertPrice" placeholder="Price" step="0.5">
          <select id="alertDir">
            <option value="above">Above</option>
            <option value="below">Below</option>
          </select>
        </div>
        <button onclick="addAlert()">Set Alert</button>
      </div>
    </div>

    <div class="alert-list" id="alertList"></div>

    <!-- Event feed -->
    <div class="panel-section" style="padding-bottom: 8px;">
      <div class="panel-title">Alert Feed</div>
    </div>
    <div class="event-feed" id="eventFeed">
      <div style="color: var(--text-muted); font-size: 11px; padding: 8px;">No alerts triggered yet.</div>
    </div>
  </div>
</div>

<script>
// --- State ---
let activeSymbol = null;
let symbols = [];
let ws = null;
let chart = null;
let lineSeries = null;
let volumeSeries = null;
const latestPrices = {};  // symbol -> {price, open, high, low, volume}
let tickCounter = 0;
let tpsInterval = null;

// --- IST time handling ---
// Lightweight Charts has no timezone support: it renders every timestamp as
// UTC. To show IST we shift each timestamp by +5:30 on the way in, then read
// it back with UTC getters — the two cancel out to IST wall-clock time.
//
// This means the formatters below MUST use getUTC* and must NOT convert to a
// timezone again; doing both would shift by 11 hours.
const IST_OFFSET_SECONDS = 5 * 3600 + 30 * 60; // 19800

// Chart-space timestamp (IST-shifted) from a real UNIX timestamp.
function toIST(unixSeconds) {
  return Math.floor(unixSeconds) + IST_OFFSET_SECONDS;
}

const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

function pad2(n) {
  return n < 10 ? '0' + n : String(n);
}

// `ts` is already IST-shifted — read as UTC to get IST wall-clock.
function istClock(ts, withSeconds) {
  const d = new Date(ts * 1000);
  const hm = pad2(d.getUTCHours()) + ':' + pad2(d.getUTCMinutes());
  return withSeconds ? hm + ':' + pad2(d.getUTCSeconds()) : hm;
}

function istDay(ts) {
  const d = new Date(ts * 1000);
  return pad2(d.getUTCDate()) + ' ' + MONTHS[d.getUTCMonth()];
}

// Crosshair / tooltip label.
function istFullLabel(ts) {
  return istDay(ts) + ' ' + istClock(ts, true) + ' IST';
}

// Time-axis tick labels.
function istTickLabel(ts, tickMarkType) {
  const TMT = (window.LightweightCharts && LightweightCharts.TickMarkType) ||
              { Year: 0, Month: 1, DayOfMonth: 2, Time: 3, TimeWithSeconds: 4 };
  const d = new Date(ts * 1000);
  switch (tickMarkType) {
    case TMT.Year:            return String(d.getUTCFullYear());
    case TMT.Month:           return MONTHS[d.getUTCMonth()];
    case TMT.DayOfMonth:      return istDay(ts);
    case TMT.TimeWithSeconds: return istClock(ts, true);
    default:                  return istClock(ts, false);
  }
}

// --- Chart Setup ---
function initChart() {
  const container = document.getElementById('chart');
  chart = LightweightCharts.createChart(container, {
    layout: {
      background: { color: '#0a0e17' },
      textColor: '#64748b',
      fontSize: 11,
      fontFamily: "'SF Mono', monospace",
    },
    grid: {
      vertLines: { color: '#1e2a3a' },
      horzLines: { color: '#1e2a3a' },
    },
    crosshair: {
      mode: LightweightCharts.CrosshairMode.Normal,
      vertLine: { color: '#3b82f680', width: 1, style: 2 },
      horzLine: { color: '#3b82f680', width: 1, style: 2 },
    },
    localization: {
      // Receives the IST-shifted timestamp — format it as UTC, not IST again.
      timeFormatter: istFullLabel,
    },
    timeScale: {
      timeVisible: true,
      secondsVisible: true,
      borderColor: '#1e2a3a',
      tickMarkFormatter: istTickLabel,
    },
    rightPriceScale: {
      borderColor: '#1e2a3a',
    },
  });

  lineSeries = chart.addLineSeries({
    color: '#3b82f6',
    lineWidth: 2,
    priceLineVisible: true,
    lastValueVisible: true,
    priceFormat: { type: 'price', precision: 2, minMove: 0.01 },
  });

  volumeSeries = chart.addHistogramSeries({
    color: '#3b82f630',
    priceFormat: { type: 'volume' },
    priceScaleId: '',
    scaleMargins: { top: 0.85, bottom: 0 },
  });

  // Handle resize
  const ro = new ResizeObserver(() => {
    chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
  });
  ro.observe(container);
}

// --- WebSocket ---
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);

  ws.onopen = () => {
    document.getElementById('statusDot').classList.add('connected');
    document.getElementById('statusText').textContent = 'Live';
  };

  ws.onclose = () => {
    document.getElementById('statusDot').classList.remove('connected');
    document.getElementById('statusText').textContent = 'Reconnecting...';
    setTimeout(connect, 2000);
  };

  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    if (msg.type === 'tick') handleTick(msg.data);
    else if (msg.type === 'alert') handleAlertEvent(msg.data);
  };
}

// --- Tick Handler ---
function handleTick(tick) {
  // Update latest prices
  latestPrices[tick.symbol] = tick;
  tickCounter++;

  // Update tab price
  const tab = document.querySelector(`.symbol-tab[data-sym="${tick.symbol}"]`);
  if (tab) {
    const priceEl = tab.querySelector('.tab-price');
    const change = tick.price - tick.open;
    const cls = change >= 0 ? 'up' : 'down';
    const sign = change >= 0 ? '+' : '';
    priceEl.className = `tab-price ${cls}`;
    priceEl.textContent = `${tick.price.toFixed(2)} ${sign}${change.toFixed(2)}`;
  }

  // If this is the active symbol, update chart + stats
  if (tick.symbol === activeSymbol) {
    const ts = toIST(tick.timestamp);
    lineSeries.update({ time: ts, value: tick.price });
    volumeSeries.update({ time: ts, value: tick.volume, color: tick.price >= tick.open ? '#22c55e30' : '#ef444430' });
    updateStats(tick);
  }
}

function updateStats(tick) {
  const change = tick.price - tick.open;
  const changePct = tick.open ? (change / tick.open * 100) : 0;
  const cls = change >= 0 ? 'up' : 'down';
  const sign = change >= 0 ? '+' : '';

  document.getElementById('statLast').textContent = tick.price.toFixed(2);
  document.getElementById('statLast').className = `stat-value ${cls}`;

  document.getElementById('statChange').textContent = `${sign}${change.toFixed(2)} (${sign}${changePct.toFixed(2)}%)`;
  document.getElementById('statChange').className = `stat-value ${cls}`;

  document.getElementById('statHigh').textContent = tick.high.toFixed(2);
  document.getElementById('statLow').textContent = tick.low.toFixed(2);
  document.getElementById('statVol').textContent = formatVolume(tick.volume);
}

function formatVolume(v) {
  if (v >= 1e6) return (v / 1e6).toFixed(1) + 'M';
  if (v >= 1e3) return (v / 1e3).toFixed(1) + 'K';
  return v.toString();
}

// --- Symbol Tabs ---
function buildTabs(syms) {
  const bar = document.getElementById('symbolBar');
  bar.innerHTML = '';
  syms.forEach((sym, i) => {
    const btn = document.createElement('button');
    btn.className = 'symbol-tab' + (i === 0 ? ' active' : '');
    btn.dataset.sym = sym;
    btn.innerHTML = `${sym}<span class="tab-price">--</span>`;
    btn.onclick = () => switchSymbol(sym);
    bar.appendChild(btn);
  });
}

function switchSymbol(sym) {
  activeSymbol = sym;
  document.querySelectorAll('.symbol-tab').forEach(t => t.classList.toggle('active', t.dataset.sym === sym));

  // Clear chart and reload
  lineSeries.setData([]);
  volumeSeries.setData([]);

  // Fetch history
  fetch(`/api/history/${sym}?minutes=60`)
    .then(r => r.json())
    .then(data => {
      if (data.ticks) {
        const lineData = [];
        const volData = [];
        const seen = new Set();
        data.ticks.forEach(t => {
          const ts = toIST(t.timestamp);
          if (!seen.has(ts)) {
            seen.add(ts);
            lineData.push({ time: ts, value: t.price });
            volData.push({ time: ts, value: t.volume, color: t.price >= t.open ? '#22c55e30' : '#ef444430' });
          }
        });
        lineSeries.setData(lineData);
        volumeSeries.setData(volData);
      }
    })
    .catch(() => {});
}

// --- Alerts ---
function addAlert() {
  const price = parseFloat(document.getElementById('alertPrice').value);
  const dir = document.getElementById('alertDir').value;
  if (!price || !activeSymbol) return;

  fetch('/api/alerts', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ symbol: activeSymbol, threshold: price, direction: dir }),
  })
    .then(r => r.json())
    .then(() => {
      document.getElementById('alertPrice').value = '';
      loadAlerts();
    });
}

function loadAlerts() {
  fetch('/api/alerts')
    .then(r => r.json())
    .then(data => {
      const list = document.getElementById('alertList');
      list.innerHTML = '';
      (data.alerts || []).forEach(a => {
        const div = document.createElement('div');
        div.className = 'alert-item';
        div.innerHTML = `
          <div class="alert-info">
            <span>${a.symbol} ${a.direction === 'above' ? '≥' : '≤'} ${a.threshold}</span>
            <span class="alert-dir">${a.direction} · ${a.active ? 'active' : 'inactive'}</span>
          </div>
          <button class="alert-remove" onclick="removeAlert('${a.id}')">&times;</button>
        `;
        list.appendChild(div);
      });
    });
}

function removeAlert(id) {
  fetch(`/api/alerts/${id}`, { method: 'DELETE' }).then(() => loadAlerts());
}

function handleAlertEvent(evt) {
  const feed = document.getElementById('eventFeed');
  // Remove placeholder
  if (feed.querySelector('div[style]')) feed.innerHTML = '';

  const time = new Date(evt.triggered_at * 1000).toLocaleTimeString();
  const div = document.createElement('div');
  div.className = 'event-item';
  div.innerHTML = `
    <strong>${evt.symbol}</strong> hit ${evt.direction} ${evt.threshold} @ <strong>${evt.triggered_price.toFixed(2)}</strong>
    <div class="event-time">${time}</div>
  `;
  feed.prepend(div);

  // Keep max 50 events
  while (feed.children.length > 50) feed.lastChild.remove();
}

// --- TPS counter ---
function startTpsCounter() {
  let lastCount = 0;
  tpsInterval = setInterval(() => {
    const tps = tickCounter - lastCount;
    lastCount = tickCounter;
    document.getElementById('statTps').textContent = tps;
  }, 1000);
}

// --- Init ---
async function init() {
  initChart();

  const resp = await fetch('/api/symbols');
  const data = await resp.json();
  symbols = data.symbols;

  buildTabs(symbols);
  activeSymbol = symbols[0];
  switchSymbol(activeSymbol);

  connect();
  loadAlerts();
  startTpsCounter();
}

init();
</script>
</body>
</html>
