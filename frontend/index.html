<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>market-stream</title>
<script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root {
    --page: #eef4fb;
    --surface: #ffffff;
    --surface-soft: #f6f9fd;
    --surface-blue: #eff6ff;
    --border: #d7e2ee;
    --border-strong: #b9c9da;
    --text-primary: #0f1f33;
    --text-secondary: #31455f;
    --text-muted: #718096;
    --accent-green: #079669;
    --accent-red: #dc2626;
    --accent-blue: #1d4ed8;
    --accent-blue-soft: #dbeafe;
    --accent-amber: #b45309;
    --shadow: 0 18px 45px rgba(15, 31, 51, 0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:
      radial-gradient(circle at top left, rgba(29, 78, 216, 0.09), transparent 30%),
      linear-gradient(135deg, #f8fbff 0%, var(--page) 48%, #f7fafc 100%);
    color: var(--text-primary);
    min-height: 100vh;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(18px);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    background: linear-gradient(135deg, #16345c, #1d4ed8);
    color: white;
    display: grid;
    place-items: center;
    font-weight: 900;
    letter-spacing: -1px;
    box-shadow: 0 10px 26px rgba(29, 78, 216, 0.28);
  }
  .header h1 {
    font-size: 20px;
    font-weight: 850;
    letter-spacing: -0.7px;
  }
  .header h1 span { color: var(--accent-blue); }
  .subtitle {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .connection-status {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--text-secondary);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 9px 12px;
    border-radius: 999px;
    box-shadow: 0 6px 18px rgba(15, 31, 51, 0.05);
  }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .home-link {
    color: var(--accent-blue);
    background: var(--surface-blue);
    border: 1px solid #bfdbfe;
    border-radius: 999px;
    padding: 9px 12px;
    font-size: 12px;
    font-weight: 850;
    text-decoration: none;
    box-shadow: 0 6px 18px rgba(15, 31, 51, 0.05);
  }
  .home-link:hover { filter: brightness(0.97); }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent-red);
    box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.11);
  }
  .status-dot.connected {
    background: var(--accent-green);
    box-shadow: 0 0 0 4px rgba(7, 150, 105, 0.12);
  }

  .container {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 360px;
    grid-template-rows: auto minmax(0, 1fr);
    gap: 18px;
    height: calc(100vh - 75px);
    padding: 18px 28px 24px;
    max-width: 1800px;
    margin: 0 auto;
  }

  .symbol-bar {
    grid-column: 1 / -1;
    display: flex;
    gap: 10px;
    background: transparent;
    overflow-x: auto;
    padding-bottom: 2px;
  }
  .symbol-tab {
    padding: 11px 14px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.86);
    color: var(--text-secondary);
    font-family: inherit;
    font-size: 13px;
    font-weight: 750;
    border-radius: 14px;
    white-space: nowrap;
    transition: all 0.15s;
    box-shadow: 0 8px 24px rgba(15, 31, 51, 0.05);
  }
  .symbol-tab:hover { border-color: var(--border-strong); transform: translateY(-1px); }
  .symbol-tab.active {
    color: var(--text-primary);
    border-color: var(--accent-blue);
    background: var(--surface-blue);
  }
  .symbol-tab .tab-price {
    margin-left: 8px;
    font-size: 12px;
    font-weight: 800;
  }
  .symbol-tab .tab-price.up { color: var(--accent-green); }
  .symbol-tab .tab-price.down { color: var(--accent-red); }

  .chart-panel {
    background: var(--surface);
    position: relative;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 22px;
    box-shadow: var(--shadow);
    min-height: 640px;
    display: flex;
    flex-direction: column;
  }
  .chart-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 18px;
    padding: 18px 20px 12px;
    border-bottom: 1px solid var(--border);
  }
  .chart-title {
    font-size: 13px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    font-weight: 850;
  }
  .chart-symbol {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: -1px;
    margin-top: 4px;
  }
  .chart-meta {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }
  .meta-pill {
    background: var(--surface-soft);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    border-radius: 999px;
    padding: 7px 10px;
    font-size: 12px;
    font-weight: 750;
  }
  #chart { width: 100%; flex: 1; min-height: 540px; }

  .right-panel {
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow: hidden;
  }
  .panel-section {
    padding: 18px;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.9);
    box-shadow: 0 10px 28px rgba(15, 31, 51, 0.06);
  }
  .panel-title {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    margin-bottom: 14px;
    font-weight: 900;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .stat-item {
    background: var(--surface-soft);
    border: 1px solid var(--border);
    padding: 11px 12px;
    border-radius: 14px;
  }
  .stat-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    font-weight: 850;
  }
  .stat-value {
    font-size: 17px;
    font-weight: 850;
    margin-top: 4px;
    letter-spacing: -0.3px;
  }
  .stat-value.up { color: var(--accent-green); }
  .stat-value.down { color: var(--accent-red); }

  .alert-form {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .alert-form .form-row {
    display: flex;
    gap: 8px;
  }
  .alert-form input, .alert-form select {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-primary);
    font-family: inherit;
    font-size: 14px;
    padding: 11px 12px;
    border-radius: 12px;
    flex: 1;
  }
  .alert-form input:focus, .alert-form select:focus {
    outline: none;
    border-color: var(--accent-blue);
    box-shadow: 0 0 0 4px rgba(29, 78, 216, 0.10);
  }
  .alert-form button {
    background: var(--accent-blue);
    color: white;
    border: none;
    font-family: inherit;
    font-size: 13px;
    padding: 11px 12px;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 850;
    box-shadow: 0 12px 26px rgba(29, 78, 216, 0.20);
  }
  .alert-form button:hover { filter: brightness(0.96); }

  .alert-list {
    overflow-y: auto;
    max-height: 220px;
  }
  .alert-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 11px 12px;
    background: var(--surface-soft);
    border: 1px solid var(--border);
    border-radius: 14px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .alert-item .alert-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .alert-item .alert-dir {
    font-size: 11px;
    color: var(--text-muted);
  }
  .alert-item .alert-remove {
    background: none;
    border: none;
    color: var(--accent-red);
    cursor: pointer;
    font-size: 14px;
    padding: 2px 6px;
  }

  .event-feed {
    flex: 1;
    overflow-y: auto;
    min-height: 160px;
  }
  .event-item {
    padding: 11px 12px;
    background: #fffbeb;
    border-left: 3px solid var(--accent-amber);
    border-radius: 12px;
    margin-bottom: 8px;
    font-size: 13px;
    line-height: 1.45;
  }
  .event-item .event-time {
    color: var(--text-muted);
    font-size: 11px;
    margin-top: 4px;
  }

  .empty-state {
    color: var(--text-muted);
    font-size: 13px;
    padding: 12px;
    border: 1px dashed var(--border-strong);
    border-radius: 14px;
    background: var(--surface-soft);
  }

  @media (max-width: 768px) {
    .header { align-items: flex-start; gap: 12px; padding: 16px; }
    .header-actions { align-self: center; }
    .container {
      grid-template-columns: 1fr;
      grid-template-rows: auto minmax(520px, 58vh) auto;
      height: auto;
      padding: 14px;
    }
    .chart-panel { min-height: 560px; }
    #chart { min-height: 440px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="brand">
    <div class="brand-mark">MS</div>
    <div>
      <h1>NSE INDEX<span>·</span>STREAM</h1>
      <div class="subtitle">NIFTY + BANKNIFTY only · Angel One feed · Dev environment</div>
    </div>
  </div>
  <div class="header-actions">
    <a class="home-link" href="https://atla.in" target="_blank" rel="noopener noreferrer">atla.in</a>
    <div class="connection-status">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Connecting...</span>
    </div>
  </div>
</div>

<div class="container">
  <!-- Symbol tabs -->
  <div class="symbol-bar" id="symbolBar"></div>

  <!-- Chart -->
  <div class="chart-panel">
    <div class="chart-header">
      <div>
        <div class="chart-title">Live NSE Index Chart</div>
        <div class="chart-symbol" id="chartSymbol">--</div>
      </div>
      <div class="chart-meta">
        <div class="meta-pill">1m updates</div>
        <div class="meta-pill">IST session</div>
        <div class="meta-pill">Dev ECS</div>
      </div>
    </div>
    <div id="chart"></div>
  </div>

  <!-- Right panel -->
  <div class="right-panel">
    <!-- Live stats -->
    <div class="panel-section">
      <div class="panel-title">Live Stats</div>
      <div class="stats-grid" id="statsGrid">
        <div class="stat-item"><div class="stat-label">Last</div><div class="stat-value" id="statLast">--</div></div>
        <div class="stat-item"><div class="stat-label">Change</div><div class="stat-value" id="statChange">--</div></div>
        <div class="stat-item"><div class="stat-label">High</div><div class="stat-value" id="statHigh">--</div></div>
        <div class="stat-item"><div class="stat-label">Low</div><div class="stat-value" id="statLow">--</div></div>
        <div class="stat-item"><div class="stat-label">Volume</div><div class="stat-value" id="statVol">--</div></div>
        <div class="stat-item"><div class="stat-label">Ticks/s</div><div class="stat-value" id="statTps">--</div></div>
      </div>
    </div>

    <!-- Alerts -->
    <div class="panel-section">
      <div class="panel-title">Price Alerts</div>
      <div class="alert-form">
        <div class="form-row">
          <input type="number" id="alertPrice" placeholder="Price" step="0.5">
          <select id="alertDir">
            <option value="above">Above</option>
            <option value="below">Below</option>
          </select>
        </div>
        <button onclick="addAlert()">Set Alert</button>
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-title">Active Alerts</div>
      <div class="alert-list" id="alertList"></div>
    </div>

    <!-- Event feed -->
    <div class="panel-section">
      <div class="panel-title">Alert Feed</div>
      <div class="event-feed" id="eventFeed">
        <div class="empty-state">No alerts triggered yet.</div>
      </div>
    </div>
  </div>
</div>

<script>
// --- State ---
let activeSymbol = null;
let symbols = [];
let ws = null;
let chart = null;
let lineSeries = null;
let volumeSeries = null;
const latestPrices = {};  // symbol -> {price, open, high, low, volume}
let tickCounter = 0;
let tpsInterval = null;
const DISPLAY_SYMBOLS = new Set(['NIFTY50', 'BANKNIFTY']);

// --- IST time handling ---
// Lightweight Charts has no timezone support: it renders every timestamp as
// UTC. To show IST we shift each timestamp by +5:30 on the way in, then read
// it back with UTC getters — the two cancel out to IST wall-clock time.
//
// This means the formatters below MUST use getUTC* and must NOT convert to a
// timezone again; doing both would shift by 11 hours.
const IST_OFFSET_SECONDS = 5 * 3600 + 30 * 60; // 19800

// Chart-space timestamp (IST-shifted) from a real UNIX timestamp.
function toIST(unixSeconds) {
  return Math.floor(unixSeconds) + IST_OFFSET_SECONDS;
}

const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

function pad2(n) {
  return n < 10 ? '0' + n : String(n);
}

// `ts` is already IST-shifted — read as UTC to get IST wall-clock.
function istClock(ts, withSeconds) {
  const d = new Date(ts * 1000);
  const hm = pad2(d.getUTCHours()) + ':' + pad2(d.getUTCMinutes());
  return withSeconds ? hm + ':' + pad2(d.getUTCSeconds()) : hm;
}

function istDay(ts) {
  const d = new Date(ts * 1000);
  return pad2(d.getUTCDate()) + ' ' + MONTHS[d.getUTCMonth()];
}

// Crosshair / tooltip label.
function istFullLabel(ts) {
  return istDay(ts) + ' ' + istClock(ts, true) + ' IST';
}

// Time-axis tick labels.
function istTickLabel(ts, tickMarkType) {
  const TMT = (window.LightweightCharts && LightweightCharts.TickMarkType) ||
              { Year: 0, Month: 1, DayOfMonth: 2, Time: 3, TimeWithSeconds: 4 };
  const d = new Date(ts * 1000);
  switch (tickMarkType) {
    case TMT.Year:            return String(d.getUTCFullYear());
    case TMT.Month:           return MONTHS[d.getUTCMonth()];
    case TMT.DayOfMonth:      return istDay(ts);
    case TMT.TimeWithSeconds: return istClock(ts, true);
    default:                  return istClock(ts, false);
  }
}

// --- Chart Setup ---
function initChart() {
  const container = document.getElementById('chart');
  chart = LightweightCharts.createChart(container, {
    layout: {
      background: { color: '#ffffff' },
      textColor: '#31455f',
      fontSize: 12,
      fontFamily: "Inter, system-ui, sans-serif",
    },
    grid: {
      vertLines: { color: '#e4edf7' },
      horzLines: { color: '#e4edf7' },
    },
    crosshair: {
      mode: LightweightCharts.CrosshairMode.Normal,
      vertLine: { color: '#1d4ed880', width: 1, style: 2 },
      horzLine: { color: '#1d4ed880', width: 1, style: 2 },
    },
    localization: {
      // Receives the IST-shifted timestamp — format it as UTC, not IST again.
      timeFormatter: istFullLabel,
    },
    timeScale: {
      timeVisible: true,
      secondsVisible: true,
      borderColor: '#d7e2ee',
      tickMarkFormatter: istTickLabel,
    },
    rightPriceScale: {
      borderColor: '#d7e2ee',
    },
  });

  lineSeries = chart.addLineSeries({
    color: '#1d4ed8',
    lineWidth: 2,
    priceLineVisible: true,
    lastValueVisible: true,
    priceFormat: { type: 'price', precision: 2, minMove: 0.01 },
  });

  volumeSeries = chart.addHistogramSeries({
    color: '#1d4ed820',
    priceFormat: { type: 'volume' },
    priceScaleId: '',
    scaleMargins: { top: 0.85, bottom: 0 },
  });

  // Handle resize
  const ro = new ResizeObserver(() => {
    chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
  });
  ro.observe(container);
}

// --- WebSocket ---
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);

  ws.onopen = () => {
    document.getElementById('statusDot').classList.add('connected');
    document.getElementById('statusText').textContent = 'Live';
  };

  ws.onclose = () => {
    document.getElementById('statusDot').classList.remove('connected');
    document.getElementById('statusText').textContent = 'Reconnecting...';
    setTimeout(connect, 2000);
  };

  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    if (msg.type === 'tick') handleTick(msg.data);
    else if (msg.type === 'alert') handleAlertEvent(msg.data);
  };
}

// --- Tick Handler ---
function handleTick(tick) {
  if (!DISPLAY_SYMBOLS.has(tick.symbol)) return;

  // Update latest prices
  latestPrices[tick.symbol] = tick;
  tickCounter++;

  updateTabPrice(tick);

  // If this is the active symbol, update chart + stats
  if (tick.symbol === activeSymbol) {
    const ts = toIST(tick.timestamp);
    lineSeries.update({ time: ts, value: tick.price });
    volumeSeries.update({ time: ts, value: tick.volume, color: tick.price >= tick.open ? '#07966926' : '#dc262626' });
    updateStats(tick);
  }
}

function updateTabPrice(tick) {
  const tab = document.querySelector(`.symbol-tab[data-sym="${tick.symbol}"]`);
  if (!tab) return;

  const priceEl = tab.querySelector('.tab-price');
  const change = tick.price - tick.open;
  const cls = change >= 0 ? 'up' : 'down';
  const sign = change >= 0 ? '+' : '';
  priceEl.className = `tab-price ${cls}`;
  priceEl.textContent = `${tick.price.toFixed(2)} ${sign}${change.toFixed(2)}`;
}

function buildSessionSnapshot(symbol, ticks) {
  if (!ticks.length) return null;

  const first = ticks[0];
  const last = ticks[ticks.length - 1];
  return {
    symbol,
    price: last.price,
    open: first.open,
    high: Math.max(...ticks.map(t => t.high)),
    low: Math.min(...ticks.map(t => t.low)),
    volume: ticks.reduce((sum, t) => sum + (Number(t.volume) || 0), 0),
    timestamp: last.timestamp,
  };
}

function updateStats(tick) {
  const change = tick.price - tick.open;
  const changePct = tick.open ? (change / tick.open * 100) : 0;
  const cls = change >= 0 ? 'up' : 'down';
  const sign = change >= 0 ? '+' : '';

  document.getElementById('statLast').textContent = tick.price.toFixed(2);
  document.getElementById('statLast').className = `stat-value ${cls}`;

  document.getElementById('statChange').textContent = `${sign}${change.toFixed(2)} (${sign}${changePct.toFixed(2)}%)`;
  document.getElementById('statChange').className = `stat-value ${cls}`;

  document.getElementById('statHigh').textContent = tick.high.toFixed(2);
  document.getElementById('statLow').textContent = tick.low.toFixed(2);
  document.getElementById('statVol').textContent = formatVolume(tick.volume);
}

function formatVolume(v) {
  if (v >= 1e6) return (v / 1e6).toFixed(1) + 'M';
  if (v >= 1e3) return (v / 1e3).toFixed(1) + 'K';
  return v.toString();
}

// --- Symbol Tabs ---
function buildTabs(syms) {
  const bar = document.getElementById('symbolBar');
  bar.innerHTML = '';
  syms.forEach((sym, i) => {
    const btn = document.createElement('button');
    btn.className = 'symbol-tab' + (i === 0 ? ' active' : '');
    btn.dataset.sym = sym;
    btn.innerHTML = `${sym}<span class="tab-price">--</span>`;
    btn.onclick = () => switchSymbol(sym);
    bar.appendChild(btn);
  });
}

function switchSymbol(sym) {
  activeSymbol = sym;
  document.getElementById('chartSymbol').textContent = sym;
  document.querySelectorAll('.symbol-tab').forEach(t => t.classList.toggle('active', t.dataset.sym === sym));
  if (latestPrices[sym]) updateStats(latestPrices[sym]);

  // Clear chart and reload
  lineSeries.setData([]);
  volumeSeries.setData([]);

  // Fetch history
  fetch(`/api/history/${sym}?minutes=1440`)
    .then(r => r.json())
    .then(data => {
      if (data.ticks) {
        const ticks = data.ticks;
        const lineData = [];
        const volData = [];
        const seen = new Set();
        ticks.forEach(t => {
          const ts = toIST(t.timestamp);
          if (!seen.has(ts)) {
            seen.add(ts);
            lineData.push({ time: ts, value: t.price });
            volData.push({ time: ts, value: t.volume, color: t.price >= t.open ? '#07966926' : '#dc262626' });
          }
        });
        lineSeries.setData(lineData);
        volumeSeries.setData(volData);
        const snapshot = buildSessionSnapshot(sym, ticks);
        if (snapshot) {
          latestPrices[sym] = snapshot;
          updateTabPrice(snapshot);
          if (sym === activeSymbol) updateStats(snapshot);
        }
      }
    })
    .catch(() => {});
}

// --- Alerts ---
function addAlert() {
  const price = parseFloat(document.getElementById('alertPrice').value);
  const dir = document.getElementById('alertDir').value;
  if (!price || !activeSymbol) return;

  fetch('/api/alerts', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ symbol: activeSymbol, threshold: price, direction: dir }),
  })
    .then(r => r.json())
    .then(() => {
      document.getElementById('alertPrice').value = '';
      loadAlerts();
    });
}

function loadAlerts() {
  fetch('/api/alerts')
    .then(r => r.json())
    .then(data => {
      const list = document.getElementById('alertList');
      list.innerHTML = '';
      (data.alerts || []).forEach(a => {
        const div = document.createElement('div');
        div.className = 'alert-item';
        div.innerHTML = `
          <div class="alert-info">
            <span>${a.symbol} ${a.direction === 'above' ? '≥' : '≤'} ${a.threshold}</span>
            <span class="alert-dir">${a.direction} · ${a.active ? 'active' : 'inactive'}</span>
          </div>
          <button class="alert-remove" onclick="removeAlert('${a.id}')">&times;</button>
        `;
        list.appendChild(div);
      });
    });
}

function removeAlert(id) {
  fetch(`/api/alerts/${id}`, { method: 'DELETE' }).then(() => loadAlerts());
}

function handleAlertEvent(evt) {
  const feed = document.getElementById('eventFeed');
  // Remove placeholder
  if (feed.querySelector('.empty-state')) feed.innerHTML = '';

  const time = new Date(evt.triggered_at * 1000).toLocaleTimeString();
  const div = document.createElement('div');
  div.className = 'event-item';
  div.innerHTML = `
    <strong>${evt.symbol}</strong> hit ${evt.direction} ${evt.threshold} @ <strong>${evt.triggered_price.toFixed(2)}</strong>
    <div class="event-time">${time}</div>
  `;
  feed.prepend(div);

  // Keep max 50 events
  while (feed.children.length > 50) feed.lastChild.remove();
}

// --- TPS counter ---
function startTpsCounter() {
  let lastCount = 0;
  tpsInterval = setInterval(() => {
    const tps = tickCounter - lastCount;
    lastCount = tickCounter;
    document.getElementById('statTps').textContent = tps;
  }, 1000);
}

// --- Init ---
async function init() {
  initChart();

  const resp = await fetch('/api/symbols');
  const data = await resp.json();
  symbols = (data.symbols || []).filter(sym => DISPLAY_SYMBOLS.has(sym));

  buildTabs(symbols);
  activeSymbol = symbols[0];
  switchSymbol(activeSymbol);

  connect();
  loadAlerts();
  startTpsCounter();
}

init();
</script>
